# Include inside the existing HTTPS server {} block, alongside location /.
# A URI error-page redirect converts failed POSTs to GET for static serving.
# A named location preserves POST and would return 405 instead of this page.
error_page 502 503 504 =503 /__d2l_maintenance.html;

location = /__d2l_maintenance.html {
    internal;
    root /var/www/direct2logbook-maintenance;
    try_files /maintenance.html =503;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
}
