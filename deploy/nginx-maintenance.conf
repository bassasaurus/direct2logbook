# Include inside the existing HTTPS server {} block, alongside location /.
# Nginx serves this independently of Django, including for failed POSTs.
error_page 502 503 504 =503 @d2l_unavailable;

location @d2l_unavailable {
    root /var/www/direct2logbook-maintenance;
    try_files /maintenance.html =503;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
}
