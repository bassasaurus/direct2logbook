<script type="text/javascript">
// exclusive checkbox selection
$("#pic").change(function() {
    var checked = $(this).is(':checked');
    $("#sic").prop('checked',false);
    if(checked) {
        $(this).prop('checked',true);
    }
});
$("#sic").change(function() {
    var checked = $(this).is(':checked');
    $("#pic").prop('checked',false);
    if(checked) {
        $(this).prop('checked',true);
    }
});
$("#solo").change(function() {
    var checked = $(this).is(':checked');
    $("#pic").prop('checked',false);
    if(checked) {
        $(this).prop('checked',true);
    }
    $("#sic").prop('checked',false);
    if(checked) {
        $(this).prop('checked',true);
    }
});
$("#dual").change(function() {
    var checked = $(this).is(':checked');
    $("#solo").prop('checked',false);
    if(checked) {
        $(this).prop('checked',true);
    }
    $("#sic").prop('checked',false);
    if(checked) {
        $(this).prop('checked',true);
    }
});
$("#solo").change(function() {
    var checked = $(this).is(':checked');
    $("#dual").prop('checked',false);

        $(this).prop('checked',true);
    }
});
$("#cfi").change(function() {
    var checked = $(this).is(':checked');
    $("#dual").prop('checked',false);
    if(checked) {
        $(this).prop('checked',true);
    }
});
$("#dual").change(function() {

    if(checked) {

});
$("#solo").change(function() {

    $("#cfi").prop('checked',false);
    if(checked) {
        $(this).prop('checked',true);
    }
});
$("#cfi").change(function() {
    var checked = $(this).is(':checked');
    $("#solo").prop('checked',false);
    if(checked) {

    }
});

    var checked = $(this).is(':checked');
    $("#solo").prop('checked',false);
    if(checked) {
        $(this).prop('checked',true);
    }
});
function updateDeviceFields() {
    const sim = $('#id_simulator').is(':checked');
    $('#id_cross_country').prop('disabled', sim);
    if (sim) $('#id_cross_country').prop('checked', false);
    $('#flight-device-fields').prop('hidden', !sim);
    $('#id_device_type').prop('required', sim);
    $('#flight-tailnumber-fields').prop('hidden', sim);
    $('#id_registration').prop('required', !sim).prop('disabled', sim);
    $('#route').prop('required', !sim).attr('placeholder', 'e.g. IAH-LAX');
    $('#aircraft-type-label').text(sim ? 'Aircraft Represented' : 'Aircraft Type');
    if (!sim) { $('#id_device_type, #id_device_id, #id_atd_type').val(''); $('#id_instrument_credit_eligible').prop('checked', false); }
    const atd = sim && $('#id_device_type').val() === 'ATD';
    $('#atd-classification').prop('hidden', !atd);
    $('#id_atd_type').prop('required', atd);
    if (!atd) $('#id_atd_type').val('');
    const credit = sim && $('#id_instrument_credit_eligible').is(':checked');
    const typeChosen = ['FFS', 'FTD', 'ATD'].includes($('#id_device_type').val());
    const classified = typeChosen && (!atd || ['BATD', 'AATD'].includes($('#id_atd_type').val()));
    const deviceReady = sim && classified && Boolean(String($('#id_device_id').val() || '').trim());
    $('#id_device_id').prop('required', sim && classified);
    $('#dual').prop('required', credit && deviceReady);
    $('label[for="dual"]').text(credit ? 'Dual' : 'Dual');
    $('label[for="id_simulated_instrument"]').text(credit ? 'Simulated Instrument' : 'Simulated Instrument');
    $('#id_simulated_instrument').attr('placeholder', '##.#');
    $('#id_simulated_instrument').prop('required', credit && deviceReady && $('#dual').is(':checked') && Number($('#id_duration').val()) > 0);
    const values = {simulator: sim, device_type: $('#id_device_type').val(), atd_type: $('#id_atd_type').val(),
      device_id: $('#id_device_id').val(), instrument_credit_eligible: credit, dual: $('#dual').is(':checked'),
      duration: $('#id_duration').val(), simulated_instrument: $('#id_simulated_instrument').val()};
    const errors = window.simulatorEntryErrors(values);
    $('#sim-stage-help').text(Object.values(errors).find(message => message !== 'Required') || '').prop('hidden', !Object.keys(errors).length);

}
$('#id_simulator, #id_cross_country, #id_device_type, #id_atd_type, #id_instrument_credit_eligible, #dual, #pic, #sic, #solo, #cfi').on('change.device', updateDeviceFields);
$('#id_device_id, #id_duration, #id_simulated_instrument').on('input change', updateDeviceFields);
updateDeviceFields();
function updateNightTimeWarning() {
    const nightLandings = Number($('#id_landings_night').val());
    const nightTime = Number($('#id_night').val());
    $('#night-time-warning').prop('hidden', !(nightLandings > 0 && !(nightTime > 0)));
}
$('#id_landings_night, #id_night').on('input change', updateNightTimeWarning);
updateNightTimeWarning();
</script>
