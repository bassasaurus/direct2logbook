<script type="text/javascript">

  $("#{{ datepicker_id|default:'id_date' }}").datepicker({
    dateFormat: "mm/dd/yy",
    changeMonth: true,
    changeYear: true,
    yearRange: "1900:+1",
    showButtonPanel: true,
    closeText: "Close",
    beforeShow: function (input, inst) {
        setTimeout(function () {
            inst.dpDiv.css({
                top: $(input).offset().top + 35,
                left: $(input).offset().left
            });
        }, 0);
    },
  });
</script>
