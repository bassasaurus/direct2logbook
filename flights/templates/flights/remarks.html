{% extends 'base.html' %}
{% block content %}

<div class="row">
  <div class="col-12">
    <h3>Remarks</h3>
  <hr>
  </div>
</div>

<div class="row">
  <div class="col-12">
  {% for flight in object_list %}
    {% if flight.remarks %}
      <article class="mb-4">
        <a href="{% url 'flight_detail' flight.pk %}">{{ flight.date|date:"m/d/Y" }} | {{ flight.route }}</a>
        <p class="mt-1 mb-0" style="white-space: pre-wrap; overflow-wrap: anywhere;">{{ flight.remarks }}</p>
      </article>
    {% endif %}
  {% endfor %}
  </div>
</div>

{% include 'pagination.html' %}



{% endblock %}
