{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="row">
  <div class="col">
    {% for navigation_year in years reversed %}
      <a href="{% url 'flight_by_year' year=navigation_year|date:'Y' %}"{% if navigation_year.year == year.year %} class="fw-bold text-dark" aria-current="page"{% endif %}>{{ navigation_year|date:"Y" }}</a>
    {% endfor %}
  </div>
</div>
<hr>
<div class="row">
  <div class="col">
    <div style="display: inline;" class="align-center">
			{% for date in date_list %}
          <a href="{% url 'flight_by_month' year=year|date:'Y' month=date|date:'b' %}" data-route-group="{{ date|date:'m' }}">{{ date|date:"F" }}</a> |
      {% endfor %}
      </div>

    </div>
</div>

<hr>
<div class="row">
  <div class="col">
    <div id="mapid" class="col image-shadow custom-popup">
      {% include 'leaflet.html' %}
    </div>
  </div>
</div>



{% endblock %}
