{% extends 'base.html' %}
{% block content %}
<form data-unsaved-changes action="" class="mt-3" method="post">
  {% csrf_token %}
  <div class="mb-3">
    <h4>Update {{ object }}</h4>
    <p>Required *</p>
    <p class="text-danger">{{ form.non_field_errors }}<p>
  </div>
  {% include 'tailnumbers/tailnumber_form.html' %}
  <button class="btn btn-primary mt-3" type="submit">Save changes</button>
</form>

{{ form.media }}
{% endblock %}
