{% extends 'base.html' %}
{% load widget_tweaks %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-12 col-sm-12">

    <form action="" class="mt-3" method="post">
      {% csrf_token %}
      <div class="form-group">
        <h4>New Aircraft</h4>
        <p>Required *</p>
        <p class="text-danger">{{ form.non_field_errors }}</p>
      </div>
      {% include 'aircraft/aircraft_form.html' %}
      <button class="btn btn-primary mt-3" type="submit">Create Aircraft</button>
    </form>
  </div>
</div>
{% endblock %}
