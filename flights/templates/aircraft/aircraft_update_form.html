{% extends 'base.html' %}
{% block content %}
<div class="card record-form-card mx-auto mt-3">
  <div class="card-body">
    <form data-submit-feedback data-unsaved-changes action="" class="mobile-record-form" method="post">
      {% csrf_token %}
      <header class="mb-3">
        <h4 class="mb-1">Update {{ aircraft.aircraft_type }}</h4>
        <p class="small text-muted mb-0">Required *</p>
      </header>
      {% if form.non_field_errors %}<div class="text-danger mb-3" role="alert">{{ form.non_field_errors }}</div>{% endif %}
      {% include 'aircraft/aircraft_form.html' %}
      <div class="record-form-actions">
        <button class="btn btn-primary w-100" type="submit">Save changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
