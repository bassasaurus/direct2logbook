{% extends 'layouts/card_page.html' %}

{% load i18n %}

{% block head_title %}{% trans "Set Password" %}{% endblock %}

{% block card_content %}
    <h1>{% trans "Set Password" %}</h1>
    <hr>

    <form method="POST" action="{% url 'account_set_password' %}" class="password_set">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn w-100 btn-link" type="submit" name="action" value="{% trans 'Set Password' %}">{% trans 'Set Password' %}</button>
    </form>
{% endblock %}
