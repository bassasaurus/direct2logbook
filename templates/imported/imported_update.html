{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12">
    <form data-unsaved-changes action="" class="mt-3" method="post">
      {% csrf_token %}
        <div class="mb-3">
          <h4>Update {{ object.aircraft_type }}</h4>
          <p>Required *</p>
          {{ form.non_field_errors }}
        </div>
          {% include 'imported/imported_form.html' %}
      <button class="btn btn-primary mt-3" type="submit">Save changes</button>
    </form>
  </div>
</div>

{% include 'flights/datepicker.html' %}
{{ form.media }}
{% endblock %}
