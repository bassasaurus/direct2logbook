{% extends 'base.html' %}
{% load widget_tweaks %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-6">
    <form data-unsaved-changes action="" class="mt-3" method="post">{% csrf_token %}
      <h3>Update Name</h3>
      <p>{{ form.first_name |attr:"placeholder:First Name" |add_class:"form-control" }}</p>

      <p>{{ form.last_name |attr:"placeholder:Last Name" |add_class:"form-control" }}</p>
      <button class="btn btn-primary mt-3" type="submit">Save changes</button>
    </form>
  </div>
</div>
{% endblock %}
