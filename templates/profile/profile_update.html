{% extends 'base.html' %}
{% load widget_tweaks %}
{% block content %}
<div class="row">
  <div class="col-lg-6">
    <h3 class="mt-3 mb-3">Update Company</h3>
    <hr>
    <form data-unsaved-changes data-submit-feedback method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label for="{{ form.company.id_for_label }}">Company</label>
      {{ form.company|attr:"placeholder:Company"|add_class:"form-control" }}
      {{ form.company.errors }}
      <button class="btn mt-3 btn-link" type="submit">Save changes</button>
    </form>
  </div>
</div>
{% endblock %}
