{% if is_paginated %}
<nav aria-label="Logbook pages" class="w-100" style="overflow-x:auto; margin-bottom:10px;">
  <ul class="pagination mb-0">
    {% for i in paginator.page_range %}
      {% if page_obj.number == i %}
        <li class="page-item active">
          <a class="page-link" href="#" aria-current="page">{{ i }} <span class="sr-only">(current)</span></a>
        </li>
      {% else %}
        <li class="page-item"><a class="page-link" href="?page={{ i }}">{{ i }}</a></li>
      {% endif %}
    {% endfor %}
  </ul>
</nav>
{% endif %}
