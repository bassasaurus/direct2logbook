

<table class="table custom-table">
  <thead class="table-light">
    <tr>
      <th scope="row">Role</th><th class="text-end">Turbine</th><th class="text-end">Piston</th>
    </tr>
  </thead>
  {% for power in powers %}
  <tr>
    <td>{{ power.role }}</td><td class="text-end">{{ power.turbine }}</td><td class="text-end">{{ power.piston }}</td>
  </tr>
  {% endfor %}
</table>
