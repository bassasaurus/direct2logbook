{% load tz %}
<!-- breadcrumb -->
<div class="breadcrumb page-breadcrumb align-items-center column-gap-3 row-gap-1">
  <div class="breadcrumb-path">
    {% if home_link %}
    <a href="{{ home_link }}">Home</a> /
    {% endif %}
    {% if parent_link %}
    <a href="{{ parent_link }}">{{ parent_name }}</a> / {{ page_title }}{% if is_paginated %} / Page {{ page_obj.number }} {% endif %}
    {% else %}
    {{ page_title }}
    {% endif %}
  </div>
  {% timezone "UTC" %}
  <time id="utc-clock" class="ms-auto text-nowrap" datetime="{% now 'c' %}" role="timer" aria-live="off"
        style="font-variant-numeric: tabular-nums;">{% now "M j, Y | H:i:s" %} UTC</time>
  {% endtimezone %}
</div>

<script>
  (function () {
    var clock = document.getElementById('utc-clock');
    if (!clock) return;

    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                  'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function pad(value) {
      return String(value).padStart(2, '0');
    }
    function updateClock() {
      var now = new Date();
      clock.dateTime = now.toISOString();
      clock.textContent = months[now.getUTCMonth()] + ' ' + now.getUTCDate() +
        ', ' + now.getUTCFullYear() + ' | ' + pad(now.getUTCHours()) + ':' +
        pad(now.getUTCMinutes()) + ':' + pad(now.getUTCSeconds()) + ' UTC';
    }

    updateClock();
    window.setInterval(updateClock, 1000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) updateClock();
    });
  })();
</script>
