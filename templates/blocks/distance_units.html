<form method="post" action="{% url 'distance_preference' %}" class="mileage-units" aria-label="Distance units">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <input type="hidden" id="distance-unit" value="{{ user.profile.distance_unit }}">
  <button type="submit" name="unit" value="nm" aria-pressed="{% if user.profile.distance_unit == 'nm' %}true{% else %}false{% endif %}">NM</button>
  <button type="submit" name="unit" value="mi" aria-pressed="{% if user.profile.distance_unit == 'mi' %}true{% else %}false{% endif %}">mi</button>
  <button type="submit" name="unit" value="km" aria-pressed="{% if user.profile.distance_unit == 'km' %}true{% else %}false{% endif %}">km</button>
</form>
