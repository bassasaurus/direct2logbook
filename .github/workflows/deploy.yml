name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  branch:
    name: Require master
    runs-on: ubuntu-24.04
    steps:
      - name: Restrict deployment to master
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/master
  verify:
    needs: branch
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    name: Deploy verified commit
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://direct2logbook.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Deploy over verified SSH
        env:
          DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENABLED" == true ]] || { echo 'Production deployment has not been enabled. See docs/CI_CD.md.'; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Invalid deployment host'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid deployment user'; exit 1; }
          [[ -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo 'Production SSH secrets are missing'; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          key_file="$RUNNER_TEMP/production-key"
          hosts_file="$RUNNER_TEMP/production-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh -T -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$GITHUB_SHA'" < deploy/production.sh
      - name: Check production pages and static assets
        run: python3 deploy/smoke.py
